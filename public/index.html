<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Portal</title>
<style>
:root{--ink:#1c2733;--steel:#2f4558;--paper:#f6f7f8;--card:#fff;--line:#c9d0d6;--muted:#5b6b78;--safety:#f2b705;--danger:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--ink:#e8edf1;--steel:#141d26;--paper:#0f161d;--card:#1a242e;--line:#33414e;--muted:#9aabb8;--danger:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Segoe UI",Tahoma,Arial,sans-serif}
header{background:var(--steel);color:#fff;padding:28px clamp(16px,5vw,64px) 22px}
header h1{margin:0;font-size:clamp(1.6rem,4vw,2.4rem);font-weight:700;letter-spacing:-.01em}
header p{margin:4px 0 0;color:#c4d0da}
.stripe{height:10px;background:repeating-linear-gradient(-45deg,var(--safety) 0 14px,#1c2733 14px 28px)}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:18px clamp(16px,5vw,64px)}
.bar input{flex:1 1 280px;max-width:520px;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink)}
.bar input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--safety);outline-offset:2px}
button{font:inherit;cursor:pointer;border:2px solid var(--ink);background:transparent;color:var(--ink);padding:9px 14px;border-radius:4px}
button.primary{background:var(--safety);border-color:var(--safety);color:#1c2733;font-weight:700}
button.danger{color:var(--danger);border-color:var(--danger)}
button.small{padding:4px 10px;font-size:.85rem}
.spacer{flex:1}
main{padding:0 clamp(16px,5vw,64px) 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px 32px}
section h2{margin:0 0 8px;font-size:1rem;color:var(--muted);font-weight:600;border-bottom:2px solid var(--line);padding-bottom:4px}
.row{display:flex;align-items:stretch;gap:8px;margin-bottom:8px}
.tile{flex:1;display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--card);border:2px solid var(--line);border-left:6px solid var(--c);padding:10px 12px;border-radius:4px;min-width:0}
.tile:hover{border-color:var(--ink);border-left-color:var(--c)}
.tile div{min-width:0;width:100%}
.tile b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .desc{display:block;color:var(--muted);font-size:0.875rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .url{display:block;font-size:0.75rem;color:var(--muted);font-family:Consolas,SFMono-Regular,Menlo,Monaco,monospace;opacity:0.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.tools{display:flex;flex-direction:column;gap:4px}
.empty{padding:0 clamp(16px,5vw,64px);color:var(--muted)}
dialog{border:2px solid var(--ink);border-radius:6px;background:var(--card);color:var(--ink);padding:22px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 12px}
label{display:block;margin:10px 0 2px;font-weight:600}
dialog input{width:100%;font:inherit;padding:9px 10px;border:2px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink)}
.err{color:var(--danger);min-height:1.4em;margin:8px 0 0}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
@media (prefers-reduced-motion:no-preference){.tile{transition:border-color .12s}}
</style>
</head>
<body>
<header><h1 id="factory">Factory Portal</h1><p>Click an app to open it.</p></header>
<div class="stripe"></div>
<div class="bar">
  <input id="q" type="search" placeholder="Search apps, e.g. clinic" autofocus aria-label="Search apps">
  <span class="spacer"></span>
  <button id="add" class="primary" hidden>Add app</button>
  <button id="auth">Admin login</button>
</div>
<main id="list"></main>
<p class="empty" id="empty" hidden>No apps match your search.</p>

<dialog id="login"><form method="dialog" id="loginForm">
  <h3>Admin login</h3>
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
  <p class="err" id="loginErr"></p>
  <div class="actions"><button type="button" data-close>Cancel</button><button class="primary">Log in</button></div>
</form></dialog>

<dialog id="edit"><form method="dialog" id="editForm">
  <h3 id="editTitle">Add app</h3>
  <label for="f-name">Name</label><input id="f-name" maxlength="60" required>
  <label for="f-url">Address</label><input id="f-url" placeholder="http://192.168.1.30:8080" required>
  <label for="f-cat">Category</label><input id="f-cat" list="cats" maxlength="40" placeholder="Company, Health, Production...">
  <datalist id="cats"></datalist>
  <label for="f-desc">Short description (optional)</label><input id="f-desc" maxlength="120">
  <p class="err" id="editErr"></p>
  <div class="actions"><button type="button" data-close>Cancel</button><button class="primary">Save app</button></div>
</form></dialog>

<script>
const $ = (s) => document.querySelector(s);
let apps = [], admin = false, editingId = null;

async function api(path, opts = {}) {
  const r = await fetch('/api/' + path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}
const colorFor = (t) => { let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h} 55% 42%)`; };
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };

function render() {
  const q = $('#q').value.trim().toLowerCase();
  const shown = apps.filter((a) => [a.name, a.category, a.description, a.url].join(' ').toLowerCase().includes(q));
  const groups = {};
  shown.forEach((a) => (groups[a.category] ||= []).push(a));
  const main = $('#list'); main.replaceChildren();
  Object.keys(groups).sort().forEach((cat) => {
    const sec = el('section', {}, el('h2', { textContent: cat }));
    groups[cat].sort((a, b) => a.name.localeCompare(b.name)).forEach((a) => {
      const tile = el('a', { className: 'tile', href: a.url, target: '_blank', rel: 'noopener' },
        el('div', {},
          el('b', { textContent: a.name }),
          ...(a.description ? [el('span', { className: 'desc', textContent: a.description })] : []),
          el('span', { className: 'url', textContent: a.url })
        )
      );
      tile.style.setProperty('--c', colorFor(cat));
      const row = el('div', { className: 'row' }, tile);
      if (admin) {
        const ed = el('button', { className: 'small', textContent: 'Edit' }); ed.onclick = () => openEdit(a);
        const del = el('button', { className: 'small danger', textContent: 'Delete' });
        del.onclick = async () => {
          if (confirm(`Delete "${a.name}" for every computer?`)) {
            try {
              await api('apps/' + a.id, { method: 'DELETE' });
              await refresh();
            } catch (err) {
              alert(err.message);
              if (err.message.includes('Admin login required')) setAdmin(false);
            }
          }
        };
        row.append(el('div', { className: 'tools' }, ed, del));
      }
      sec.append(row);
    });
    main.append(sec);
  });
  if (apps.length === 0) {
    $('#empty').textContent = admin ? 'No apps added yet. Click "Add app" above.' : 'No apps added yet.';
    $('#empty').hidden = false;
  } else if (shown.length === 0) {
    $('#empty').textContent = 'No apps match your search.';
    $('#empty').hidden = false;
  } else {
    $('#empty').hidden = true;
  }
  $('#cats').replaceChildren(...[...new Set(apps.map((a) => a.category))].map((c) => el('option', { value: c })));
}
async function refresh() { apps = (await api('apps')).apps; render(); }
function setAdmin(v) { admin = v; $('#add').hidden = !v; $('#auth').textContent = v ? 'Log out' : 'Admin login'; render(); }

function openEdit(a) {
  editingId = a ? a.id : null;
  $('#editTitle').textContent = a ? 'Edit app' : 'Add app';
  $('#f-name').value = a?.name || ''; $('#f-url').value = a?.url || '';
  $('#f-cat').value = a?.category || ''; $('#f-desc').value = a?.description || '';
  $('#editErr').textContent = ''; $('#edit').showModal();
}
document.querySelectorAll('[data-close]').forEach((b) => (b.onclick = () => b.closest('dialog').close()));
document.querySelectorAll('dialog').forEach((d) => {
  d.addEventListener('click', (e) => { if (e.target === d) d.close(); });
});
$('#q').oninput = render;
$('#q').addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('#q').value) { $('#q').value = ''; render(); }
});
window.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== $('#q') && !$('dialog[open]') && e.target.tagName !== 'INPUT') {
    e.preventDefault();
    $('#q').focus();
    $('#q').select();
  }
});

$('#add').onclick = () => openEdit(null);
$('#auth').onclick = async () => {
  if (admin) { await api('logout', { method: 'POST' }); setAdmin(false); }
  else { $('#pw').value = ''; $('#loginErr').textContent = ''; $('#login').showModal(); }
};
$('#loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button.primary');
  btn.disabled = true;
  try {
    await api('login', { method: 'POST', body: JSON.stringify({ password: $('#pw').value }) });
    $('#login').close();
    setAdmin(true);
  } catch (err) {
    $('#loginErr').textContent = err.message;
  } finally {
    btn.disabled = false;
  }
};
$('#editForm').onsubmit = async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button.primary');
  btn.disabled = true;
  const body = JSON.stringify({ name: $('#f-name').value, url: $('#f-url').value, category: $('#f-cat').value, description: $('#f-desc').value });
  try {
    await api(editingId ? 'apps/' + editingId : 'apps', { method: editingId ? 'PUT' : 'POST', body });
    $('#edit').close();
    await refresh();
  } catch (err) {
    $('#editErr').textContent = err.message;
    if (err.message.includes('Admin login required')) setAdmin(false);
  } finally {
    btn.disabled = false;
  }
};

(async () => {
  try {
    const [s, data] = await Promise.all([api('session'), api('apps')]);
    $('#factory').textContent = s.factory;
    document.title = s.factory;
    apps = data.apps;
    setAdmin(s.admin);
  } catch (err) {
    $('#empty').textContent = 'Unable to connect to portal server. Retrying...';
    $('#empty').hidden = false;
  }
})();
setInterval(() => refresh().catch(() => {}), 60000);
</script>
</body>
</html>
